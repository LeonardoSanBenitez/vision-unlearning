name: Pytest + Coverage

on:
  push:
    branches: ["dev","test_matrix"]
  pull_request:
    branches: ["dev","test_matrix"]

permissions:
  contents: write

jobs:
  pytest_coverage:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Free Disk Space
        run: |
          sudo rm -rf /opt/ghc /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Add pytest-cov
        run: poetry add --dev pytest-cov

      - name: Install package (editable mode)
        run: poetry run pip install -e .

      - name: Run tests with coverage
        run: |
          echo "------------ Pytest + Coverage on Python ${{ matrix.python-version }} -------------"
          poetry run pytest --cov=vision_unlearning \
            --cov-report=xml:coverage-${{ matrix.python-version }}.xml \
            --cov-report=json:coverage-${{ matrix.python-version }}.json \
            --junitxml=reports/tests-results-${{ matrix.python-version }}.xml

      # Only create and push the badge on Python 3.10
      - name: Create Coverage Badge (only on Py3.10)
        if: matrix.python-version == '3.10'
        run: |
          COVERAGE=$(jq '.totals.percent_covered_display' coverage-3.10.json | tr -d '"')
          COLOR="red"
          if [ ${COVERAGE%.*} -ge 90 ]; then COLOR="brightgreen";
          elif [ ${COVERAGE%.*} -ge 75 ]; then COLOR="green";
          elif [ ${COVERAGE%.*} -ge 10 ]; then COLOR="yellow"; fi

          echo '{ "schemaVersion": 1, "label": "coverage", "message": "'$COVERAGE'%", "color": "'$COLOR'" }' > coverage-badge.json

      - name: Push badge to branch (only on Py3.10)
        if: matrix.python-version == '3.10'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin
          git checkout -B dev

          mv coverage-badge.json coverage.json
          git add coverage.json

          git restore pyproject.toml
          git clean -fd

          if ! git diff --cached --quiet; then
            git commit -m "Update coverage badge"
            git push origin dev
          else
            echo "No changes to commit. Skipping."
          fi
