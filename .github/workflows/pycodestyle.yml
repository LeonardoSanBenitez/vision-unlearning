name: Pycodestyle Check

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]

concurrency:
  group: pycodestyle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pycodestyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      # Pinned to match the Dockerfile's `poetry~=1.2` constraint -- see mypy.yml for why.
      - run: pip install "poetry~=1.2"
      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          # Cache key includes the runner image version (not just poetry.lock + Python
          # version) so a GitHub-side runner image bump cannot be masked by a stale
          # cache of wheels compiled against an older image.
          key: poetry-${{ runner.os }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-py3.10-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-py3.10-
      - run: poetry install --no-interaction --no-root
      - run: |
          echo '----------- Pycodestyle check ----------'
          # Ignore list must match the Makefile exactly so CI and local checks are equivalent.
          # E701: multiple statements on one line
          # W605,E251,E252: common in research/generated code
          # E265,E303,E302,E305: comment style and blank-line conventions in research files
          # W293,W291: trailing whitespace (cosmetic)
          # E225,E227: operator spacing (cosmetic)
          # E721: type() comparison style
          # E741: ambiguous variable names
          # W391: blank line at end of file
          # E117,E501: over-indent and long lines
          # W503,W504: line break before/after binary operator (PEP8 style choice — codebase uses W503 style)
          poetry run pycodestyle --max-line-length=300 \
            --ignore=E701,W605,E251,E252,E265,E303,E302,E305,W293,W291,E225,E227,E721,E741,W391,E117,E501,W503,W504 \
            ./vision_unlearning
