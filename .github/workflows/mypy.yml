name: Mypy Check

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]

concurrency:
  group: mypy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      # Pinned to match the Dockerfile's `poetry~=1.2` constraint. An unpinned install
      # here silently drifted to Poetry 2.x while Docker stayed on 1.8.5 -- Poetry's
      # lock-file format/content-hash changed between major versions, so CI started
      # rejecting a perfectly valid Docker-generated poetry.lock with "pyproject.toml
      # changed significantly since poetry.lock was last generated" (discovered
      # 2026-07-02, PLAN-TASK-2026-07-01-TestTooling.md).
      - run: pip install "poetry~=1.2"
      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          # Cache key includes the runner image version (not just poetry.lock + Python
          # version) so a GitHub-side runner image bump cannot be masked by a stale
          # cache of wheels compiled against an older image.
          key: poetry-${{ runner.os }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-py3.10-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-py3.10-
      - run: poetry install --no-interaction --no-root
      - run: |
          echo '----------- Mypy check (install stubs silently) ---------------'
          # First pass: install any missing type stubs. Suppress output to avoid noise.
          # Flags must match the Makefile exactly to ensure CI and local checks agree.
          poetry run mypy --install-types --non-interactive ./vision_unlearning > /dev/null 2>&1 || true

          echo '----------- Mypy check ---------------'
          poetry run mypy \
            --no-warn-incomplete-stub \
            --disable-error-code import-untyped \
            --explicit-package-bases \
            --check-untyped-defs \
            ./vision_unlearning
