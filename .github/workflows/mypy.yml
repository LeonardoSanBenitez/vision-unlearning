name: Mypy Check

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install poetry
      - run: poetry install --no-interaction --no-root
      - run: |
          echo '----------- Mypy check ---------------'
          poetry run mypy --install-types --non-interactive ./vision_unlearning
          poetry run mypy --no-warn-incompatible-stub --disable-error-code import-untyped --explicit-package-bases --check-untyped-defs ./vision_unlearning
