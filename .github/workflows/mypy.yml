name: Mypy Check

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]

jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install poetry
      - run: poetry install --no-interaction --no-root
      - run: |
          echo '----------- Mypy check (install stubs silently) ---------------'
          # First pass: install any missing type stubs. Suppress output to avoid noise.
          # Flags must match the Makefile exactly to ensure CI and local checks agree.
          poetry run mypy --install-types --non-interactive ./vision_unlearning > /dev/null 2>&1 || true

          echo '----------- Mypy check ---------------'
          poetry run mypy \
            --no-warn-incomplete-stub \
            --disable-error-code import-untyped \
            --explicit-package-bases \
            --check-untyped-defs \
            ./vision_unlearning