name: Automated Testing

on:
  push:
    branches: ["soham"]
  pull_request:
    branches: ["soham"]

jobs:
  mypy:
    name: Mypy Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install poetry
      - run: poetry install --no-interaction --no-root
      - run: |
          echo '----------- Mypy check ---------------'
          poetry run mypy --install-types --non-interactive ./vision_unlearning
          poetry run mypy --no-warn-incompatible-stub --disable-error-code import-untyped --explicit-package-bases --check-untyped-defs ./vision_unlearning

  pycodestyle:
    name: Pycodestyle Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install poetry
      - run: poetry install --no-interaction --no-root
      - run: |
          echo '----------- Pycodestyle check ----------'
          poetry run pycodestyle --max-line-length=200 --ignore=E701 ./vision_unlearning

    tests:
    name: Pytest + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }

      - name: Free Disk Space
        run: |
          sudo rm -rf /opt/ghc /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Add pytest-cov
        run: poetry add --dev pytest-cov

      - name: Install package (editable mode)
        run: poetry run pip install -e .

      - name: Run tests with coverage
        run: |
          echo '------------ Pytest + Coverage check -------------'
          poetry run pytest --cov=vision_unlearning \
                            --cov-report=xml \
                            --junitxml=reports/tests-results.xml tests

      - name: Upload Coverage Report
        uses: codecov/codecov-action@v4
