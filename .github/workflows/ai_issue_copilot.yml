name: Summarize new issues

on:
  issues:
    types: [opened]

jobs:
  summary:
    # Allowed users list is defined in:
    # Settings → secrets and variables → Actions → variables → ALLOWED_USERS
    # Format: JSON array, e.g. ["user1","user2"]
    if: contains(fromJson(vars.ALLOWED_USERS), github.actor)

    runs-on: ubuntu-latest
    permissions:
      issues: write
      models: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run AI inference
        id: inference
        uses: actions/ai-inference@v1
        with:
          prompt: |
            Given the following GitHub issue:
            Title: ${{ github.event.issue.title }}
            Body: ${{ github.event.issue.body }}
            Provide a TECHINCAL explanation of how could this be implemented
          file_input: |
            readme: ./README.md

      - name: Comment with AI summary
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "$RESPONSE"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESPONSE: ${{ steps.inference.outputs.response }}
