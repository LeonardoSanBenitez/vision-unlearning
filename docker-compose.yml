services:
  notebooks:
    container_name: vision-unlearning-notebooks
    build: 
      context: .
      dockerfile: Dockerfile
    command: ["poetry", "run", "jupyter", "notebook", "--port=8889", "--no-browser", "--ip=0.0.0.0", "--allow-root", "--NotebookApp.token=7e500f07-fe1c-44b4-b2c5-bad27bbb17f9"]
    volumes:
      - ./:/src
    environment:
      - PYTHONPATH=.:/src
      - HF_HUB_ETAG_TIMEOUT=120
    ports:
       - 8889:8889
